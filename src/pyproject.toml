[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "interactgarment"
version = "0.1.0"
description = "InteractGarment: Diffusion-based garment generation and interaction using LightningDiT and VA-VAE"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "InteractGarment Team"}
]
maintainers = [
    {name = "InteractGarment Team"}
]
keywords = ["diffusion", "garment", "generation", "machine learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    # Core ML dependencies
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy>=2",
    
    # Main requirements
    "timm==1.0.12",
    "diffusers==0.32.1",
    "accelerate",
    "torchdiffeq",
    "pytorch_fid",
    "tensorboard==2.16.2",
    "omegaconf==2.3.0",
    "einops",
    "fairscale",
    "safetensors",
    "wandb",
    "pillow",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
]

all = [
    "interactgarment[dev,eval]",
]

[project.urls]
Repository = "https://github.com/your-org/InteractGarment"
Documentation = "https://github.com/your-org/InteractGarment/blob/main/README.md"
"Bug Tracker" = "https://github.com/your-org/InteractGarment/issues"

[project.scripts]
interactgarment-train = "train:main"
interactgarment-inference = "inference_example:main"
interactgarment-inversion = "inversion_example:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*", "output*", "tensorboard_logs*", "assets*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.md"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | output
  | tensorboard_logs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
]
